<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020817" stop-opacity="0.12"/>
      <stop offset="0.58" stop-color="#020817" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071839" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#091d50" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image href="facebook-cruizx-launch-background.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#shade)"/>

  <image href="cruizx-logo-nobg.png" x="390" y="44" width="300" height="253" preserveAspectRatio="xMidYMid meet"/>

  <text x="540" y="348" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    NU FÖR iPHONE &amp; ANDROID
  </text>
  <text x="540" y="401" fill="#8fd8ff" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    Navigation utvecklad för A-traktorer, mopedbilar och låga fordon
  </text>

  <rect x="65" y="445" width="950" height="560" rx="38" fill="url(#card)" stroke="#2d92ff" stroke-opacity="0.55" stroke-width="2" filter="url(#shadow)"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(112 510)">
      <circle cx="27" cy="27" r="27" fill="#0d60b8" stroke="#62d7ff" stroke-width="2"/>
      <path d="M14 30h26M17 24l7-8h12l5 8M19 30v7m18-7v7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="73" y="22" fill="#ffffff" font-size="24" font-weight="750">Anpassade rutter</text>
      <text x="73" y="51" fill="#bcd8f2" font-size="19">för ditt fordon och din hastighet</text>
    </g>

    <g transform="translate(112 635)">
      <circle cx="27" cy="27" r="27" fill="#0d60b8" stroke="#62d7ff" stroke-width="2"/>
      <text x="27" y="35" fill="#ffffff" font-size="21" font-weight="850" text-anchor="middle">AI</text>
      <text x="73" y="22" fill="#ffffff" font-size="24" font-weight="750">AI-ruttanalys</text>
      <text x="73" y="51" fill="#bcd8f2" font-size="19">fördelar, varningar och råd</text>
    </g>

    <g transform="translate(112 760)">
      <circle cx="27" cy="27" r="27" fill="#0d60b8" stroke="#62d7ff" stroke-width="2"/>
      <path d="M27 12l17 31H10z" fill="none" stroke="#ff9b45" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M27 22v9m0 6v1" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
      <text x="73" y="22" fill="#ffffff" font-size="24" font-weight="750">Trafikvarningar</text>
      <text x="73" y="51" fill="#bcd8f2" font-size="19">vägstopp, köer, gupp och mer</text>
    </g>

    <g transform="translate(568 510)">
      <circle cx="27" cy="27" r="27" fill="#0d60b8" stroke="#62d7ff" stroke-width="2"/>
      <circle cx="20" cy="23" r="6" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="36" cy="23" r="6" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M10 42c2-8 17-8 20 0m-2 0c2-8 17-8 20 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="73" y="22" fill="#ffffff" font-size="24" font-weight="750">Konvojläge</text>
      <text x="73" y="51" fill="#bcd8f2" font-size="19">frivillig liveposition i gruppen</text>
    </g>

    <g transform="translate(568 635)">
      <circle cx="27" cy="27" r="27" fill="#0d60b8" stroke="#62d7ff" stroke-width="2"/>
      <path d="M27 11c-9 0-16 7-16 16 0 12 16 25 16 25s16-13 16-25c0-9-7-16-16-16z" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="27" cy="27" r="5" fill="#ff8b3d"/>
      <text x="73" y="22" fill="#ffffff" font-size="24" font-weight="750">Offentliga träffar</text>
      <text x="73" y="51" fill="#bcd8f2" font-size="19">hitta träffar och deltagande bilar</text>
    </g>

    <g transform="translate(568 760)">
      <circle cx="27" cy="27" r="27" fill="#0d60b8" stroke="#62d7ff" stroke-width="2"/>
      <circle cx="27" cy="27" r="16" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M11 27h32M27 11c5 5 8 10 8 16s-3 11-8 16c-5-5-8-10-8-16s3-11 8-16z" fill="none" stroke="#fff" stroke-width="2.6"/>
      <text x="73" y="22" fill="#ffffff" font-size="24" font-weight="750">Flera länder &amp; språk</text>
      <text x="73" y="51" fill="#bcd8f2" font-size="19">byggd för resor genom Europa</text>
    </g>

    <text x="540" y="936" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">Ladda ner CruizX och testa idag</text>
    <text x="540" y="970" fill="#79d9ff" font-size="19" font-weight="650" text-anchor="middle">Vi tar gärna emot feedback och nya idéer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="112" y="1055" width="856" height="190" rx="32" fill="#04112c" fill-opacity="0.9" stroke="#2b78db" stroke-opacity="0.45"/>
    <image href="download-on-the-app-store.svg" x="190" y="1096" width="300" height="100" preserveAspectRatio="xMidYMid meet"/>
    <image href="Android-v6.png" x="590" y="1096" width="300" height="100" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <text x="540" y="1300" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="1.5">CRUIZX.COM</text>
</svg>
