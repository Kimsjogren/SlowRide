# SlowRide/CruizX Valhalla Routing Server
# Self-hosted routing for A-traktor, Mopedbil and Tractor navigation
#
# Quick start:
#   1. Run: docker-compose up -d
#   2. Wait for tiles to build (first run takes several hours with all countries)
#   3. Test: curl http://localhost:8002/status
#
# Download maps from Geofabrik:
#   Sweden:  https://download.geofabrik.de/europe/sweden-latest.osm.pbf
#   Norway:  https://download.geofabrik.de/europe/norway-latest.osm.pbf
#   Denmark: https://download.geofabrik.de/europe/denmark-latest.osm.pbf
#   Finland: https://download.geofabrik.de/europe/finland-latest.osm.pbf
#   France:  https://download.geofabrik.de/europe/france-latest.osm.pbf

version: '3.8'

services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: slowride-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./data:/custom_files
    environment:
      - "tile_urls=https://download.geofabrik.de/europe/sweden-latest.osm.pbf https://download.geofabrik.de/europe/norway-latest.osm.pbf https://download.geofabrik.de/europe/denmark-latest.osm.pbf https://download.geofabrik.de/europe/finland-latest.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf"
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - serve_tiles=True
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - additional_data_elevation=
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
