# SlowRide/CruizX Valhalla Routing Server
# Self-hosted routing for A-traktor, Mopedbil and Tractor navigation
#
# Quick start:
#   1. Place sweden-latest.osm.pbf in ./data/ folder
#   2. Run: docker-compose up -d
#   3. Wait for tiles to build (first run takes ~30-60 min for Sweden)
#   4. Test: curl http://localhost:8002/status
#
# Download maps from Geofabrik:
#   Sweden: https://download.geofabrik.de/europe/sweden-latest.osm.pbf
#   Norway: https://download.geofabrik.de/europe/norway-latest.osm.pbf
#   Finland: https://download.geofabrik.de/europe/finland-latest.osm.pbf

version: '3.8'

services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: slowride-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      # Map data and tiles storage
      - ./data:/custom_files
    environment:
      # Build tiles automatically when container starts (Nordic countries)
      - tile_urls=https://download.geofabrik.de/europe/sweden-latest.osm.pbf https://download.geofabrik.de/europe/norway-latest.osm.pbf https://download.geofabrik.de/europe/denmark-latest.osm.pbf https://download.geofabrik.de/europe/finland-latest.osm.pbf
      
      # Use all available CPU cores for tile building
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      
      # Server configuration
      - serve_tiles=True
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      
      # Memory settings (adjust based on your server)
      # For all Nordic countries, 8GB recommended
      - additional_data_elevation=
    
    # Resource limits (adjust based on your server specs)
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 4G
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

