server {
  listen 80;
  server_name _;

  # Keep existing Valhalla API available under /routing/
  location /routing/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://valhalla:8002/;
  }

  # Optional convenience health check
  location = /status {
    proxy_pass http://valhalla:8002/status;
  }

  # Tile server (raster/vector/styles) under /tiles/
  location /tiles/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://tileserver:8080/;
  }
}
