<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Nunito:ital,wght@1,800;1,900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#fff; }

  /* A4 landscape @ 300dpi = 3508 x 2480 px */
  .sheet {
    width: 3508px;
    height: 2480px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 60px;
    position:relative;
  }

  /* cell holds bleed box + margin for crop marks */
  .cell {
    position:relative;
    width: 1412px;   /* 1252 bleed + 2*80 margin */
    height: 2003px;  /* 1843 bleed + 2*80 margin */
  }

  /* bleed box = 106 x 156 mm = 1252 x 1843 px (3mm bleed each side) */
  .bleed {
    position:absolute;
    top:80px; left:80px;
    width:1252px; height:1843px;
    overflow:hidden;
    font-family:'Montserrat', sans-serif;
    background: radial-gradient(circle at 50% 30%, #1b4fd6 0%, #0a2a8c 45%, #061a55 100%);
  }
  .bleed::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 28%, rgba(80,150,255,0.35) 0%, transparent 55%);
  }
  .roads {
    position:absolute; inset:0; opacity:0.10;
    background-image:
      linear-gradient(115deg, transparent 48%, #fff 49%, #fff 50%, transparent 51%),
      linear-gradient(200deg, transparent 60%, #fff 61%, #fff 62%, transparent 63%),
      linear-gradient(70deg, transparent 30%, #fff 31%, #fff 32%, transparent 33%);
  }
  .content {
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    gap: 50px;
    padding: 145px 129px;  /* 3mm bleed + original 110/94 */
    text-align:center;
  }
  .hook {
    margin-top:25px;
    font-size: 94px; font-weight:900; color:#fff;
    line-height:1.12; letter-spacing:-0.02em;
    text-shadow: 0 6px 50px rgba(0,0,0,0.4);
  }
  .hook .hl { color:#ff9d3d; }
  .logo {
    margin-top:45px;
    width: 800px;
    filter: drop-shadow(0 24px 88px rgba(0,0,0,0.45));
  }
  .bottom { display:flex; flex-direction:column; align-items:center; gap:30px; margin-top:50px; }
  .scan {
    font-family:'Nunito', sans-serif; font-style:italic; font-weight:900;
    font-size:54px; color:#fff; letter-spacing:-0.01em;
    text-shadow:0 4px 24px rgba(0,0,0,0.35);
  }
  .qr { background:#fff; padding:0; border-radius:0; box-shadow:0 0 60px rgba(255,255,255,0.22); line-height:0; }
  .qr img { width:250px; height:auto; display:block; }
  .free {
    font-family:'Nunito', sans-serif; font-style:italic; font-weight:900;
    font-size:54px; color:#fff; letter-spacing:-0.01em;
    text-shadow:0 4px 24px rgba(0,0,0,0.35);
  }
  .free .hl { color:#ff9d3d; }
  .types {
    margin-top:45px;
    font-family:'Montserrat', sans-serif; font-weight:700;
    font-size:34px; color:#cfe0ff; letter-spacing:0.02em;
    display:flex; align-items:center; justify-content:center; gap:24px;
    white-space:nowrap;
  }
  .types .dot { color:#ff9d3d; font-weight:900; }

  /* crop marks */
  .cm { position:absolute; background:#000; }
  .cm.v { width:3px; height:55px; }
  .cm.h { height:3px; width:55px; }
</style>
</head>
<body>
  <div class="sheet" id="sheet">
    <!-- one cell template repeated by JS -->
  </div>

<script>
  function buildSticker() {
    return `
      <div class="bleed">
        <div class="roads"></div>
        <div class="content">
          <div class="hook">CruizX tar dig <span class="hl">hem</span></div>
          <img class="logo" src="cruizx-logo-nobg.png" alt="CruizX" />
          <div class="bottom">
            <div class="scan">Scanna mig</div>
            <div class="qr"><img src="qr-apple.png" alt="QR" /></div>
            <div class="free"><span class="hl">7 dagar gratis Pro</span></div>
            <div class="types"><span class="dot">•</span> A-Traktor <span class="dot">•</span> Mopedbil <span class="dot">•</span> Traktor</div>
          </div>
        </div>
      </div>`;
  }
  function buildCropMarks() {
    // coordinates in cell space
    const M=80, BLW=1252, BLH=1843, B=35, L=55;
    const lx = M+B, rx = M+BLW-B, ty = M+B, by = M+BLH-B;      // trim lines
    const bl=M, br=M+BLW, bt=M, bb=M+BLH;                        // bleed edges
    const marks = [];
    const v=(left,top)=>`<div class="cm v" style="left:${left-1.5}px;top:${top}px"></div>`;
    const h=(left,top)=>`<div class="cm h" style="left:${left}px;top:${top-1.5}px"></div>`;
    // top-left
    marks.push(v(lx, bt-L)); marks.push(h(bl-L, ty));
    // top-right
    marks.push(v(rx, bt-L)); marks.push(h(br, ty));
    // bottom-left
    marks.push(v(lx, bb)); marks.push(h(bl-L, by));
    // bottom-right
    marks.push(v(rx, bb)); marks.push(h(br, by));
    return marks.join('');
  }
  const sheet = document.getElementById('sheet');
  for (let i=0;i<2;i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = buildSticker() + buildCropMarks();
    sheet.appendChild(cell);
  }
</script>
</body>
</html>
