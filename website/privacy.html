<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CruizX Privacy</title>
    <meta name="description" content="CruizX Privacy Policy" />
    <script src="./analytics.js" defer></script>
    <style>
      :root {
        --panel: rgba(10, 24, 58, 0.86);
        --line: rgba(255, 255, 255, 0.16);
        --text: #eef5ff;
        --muted: rgba(238, 245, 255, 0.8);
        --accent: #4bb4ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(rgba(5, 14, 33, 0.7), rgba(5, 14, 33, 0.86)), url("./assets/background.png") center/cover fixed no-repeat;
      }
      .topbar, main {
        width: min(960px, calc(100% - 2rem));
        margin-left: auto;
        margin-right: auto;
      }
      .topbar {
        margin-top: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .back {
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.4rem 0.6rem;
        font-size: 0.9rem;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.06);
      }
      .date { color: var(--accent); font-size: 0.92rem; }
      main {
        margin-top: 1rem;
        margin-bottom: 2rem;
        padding: 1.3rem;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { margin: 0 0 0.7rem; font-size: clamp(1.7rem, 3.8vw, 2.2rem); }
      h2 { margin: 1rem 0 0.55rem; font-size: clamp(1.08rem, 2.2vw, 1.34rem); }
      p, li { color: var(--muted); line-height: 1.6; }
      ul { padding-left: 1.2rem; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="back" id="back-link" href="./index.html">Back to CruizX</a>
      <span class="date" id="updated"></span>
    </div>
    <main id="content"></main>
    <script>
      const supported = ["da", "en", "fi", "fr", "nb", "sv"];
      const queryLang = new URLSearchParams(window.location.search).get("lang");
      const savedLang = localStorage.getItem("cruizx_site_lang");
      const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
      const lang = supported.includes(queryLang)
        ? queryLang
        : supported.includes(savedLang)
          ? savedLang
          : supported.includes(browserLang)
            ? browserLang
            : "en";

      const copy = {
        en: {
          back: "Back to CruizX",
          updated: "Last updated: July 28, 2026",
          html: `<h1>Privacy Policy</h1><p>This page explains how CruizX handles personal data in the app and on this website.</p><h2>What we collect</h2><ul><li>Account details such as email, display name, user ID and optional profile image.</li><li>Location and route information for navigation, convoy flow, ETA and map functions.</li><li>Convoy and chat data, shared pins, and live member presence where enabled.</li><li>Community road alerts submitted, validated or interacted with by users.</li><li>Parent Mode and linked-account settings where that feature is used.</li><li>Technical/device information for reliability, abuse prevention and analytics.</li></ul><h2>Why we process data</h2><p>To deliver core app functionality including navigation, convoy coordination, account security, launch communication, and support.</p><h2>AI route analysis</h2><p>If you explicitly enable AI route analysis, CruizX sends limited route facts—distance, travel time, vehicle type, road names and warning counts—to the CruizX API and Cloudflare Workers AI to create a summary. CruizX does not send your GPS position, destination coordinates, email or name for this feature. Cloudflare states that Workers AI customer content is not used to train models or improve its services without explicit consent. You can decline and continue using normal navigation.</p><h2>Third-party services</h2><p>CruizX may use providers such as Supabase, Cloudflare, ntfy for private support notifications, Google Mobile Ads/AdMob and optional Firebase services depending on configuration.</p><h2>Your choices</h2><p>You can manage app permissions (location and tracking), choose language, and contact us regarding privacy requests.</p><h2>Contact</h2><p>Visit <a href="https://cruizx.com" target="_blank" rel="noreferrer">cruizx.com</a> for support and legal contact paths.</p>`,
        },
        sv: {
          back: "Tillbaka till CruizX",
          updated: "Senast uppdaterad: 28 juli 2026",
          html: `<h1>Integritetspolicy</h1><p>Den här sidan förklarar hur CruizX hanterar personuppgifter i appen och på webbplatsen.</p><h2>Vad vi samlar in</h2><ul><li>Kontouppgifter som e-post, visningsnamn, användar-ID och valfri profilbild.</li><li>Plats- och ruttinformation för navigation, konvojflöde, ETA och kartfunktioner.</li><li>Konvoj- och chattdata, delade markeringar och live-närvaro där det är aktiverat.</li><li>Community-varningar som skickas in, bekräftas eller hanteras av användare.</li><li>Inställningar för Parent Mode och länkade konton när funktionen används.</li><li>Teknisk/enhetsinformation för stabilitet, missbruksförebyggande och analys.</li></ul><h2>Varför vi behandlar data</h2><p>För att leverera appens kärnfunktioner som navigation, konvojkoordinering, kontosäkerhet, lanseringskommunikation och support.</p><h2>AI-ruttanalys</h2><p>Om du uttryckligen aktiverar AI-ruttanalys skickar CruizX begränsade ruttfakta—avstånd, restid, fordonstyp, vägnamn och antal varningar—till CruizX API och Cloudflare Workers AI för att skapa en sammanfattning. GPS-position, destinationskoordinater, e-post och namn skickas inte för funktionen. Cloudflare uppger att kundinnehåll i Workers AI inte används för att träna modeller eller förbättra deras tjänster utan uttryckligt samtycke. Du kan avstå och fortsätta använda vanlig navigation.</p><h2>Tredjepartstjänster</h2><p>CruizX kan använda tjänster som Supabase, Cloudflare, ntfy för privata supportnotiser, Google Mobile Ads/AdMob och valfria Firebase-tjänster beroende på konfiguration.</p><h2>Dina val</h2><p>Du kan hantera appbehörigheter (plats och spårning), välja språk och kontakta oss för integritetsärenden.</p><h2>Kontakt</h2><p>Besök <a href="https://cruizx.com" target="_blank" rel="noreferrer">cruizx.com</a> för support och juridisk kontakt.</p>`,
        },
        nb: {
          back: "Tilbake til CruizX",
          updated: "Sist oppdatert: 7. april 2026",
          html: `<h1>Personvernerklæring</h1><p>Denne siden forklarer hvordan CruizX håndterer persondata i appen og på nettsiden.</p><h2>Hva vi samler inn</h2><ul><li>Kontodata som e-post, visningsnavn, bruker-ID og valgfritt profilbilde.</li><li>Posisjon- og ruteinformasjon for navigasjon, konvoiflyt, ETA og kartfunksjoner.</li><li>Konvoi- og chatdata, delte markører og live-tilstedeværelse der aktivert.</li><li>Community-varsler som sendes inn, bekreftes eller brukes av brukere.</li><li>Parent Mode-innstillinger og koblede kontoer når funksjonen brukes.</li><li>Teknisk/enhetsinformasjon for stabilitet, misbruksvern og analyse.</li></ul><h2>Hvorfor vi behandler data</h2><p>For å levere kjernefunksjoner som navigasjon, konvoikoordinering, kontosikkerhet, lanseringskommunikasjon og support.</p><h2>Tredjepartstjenester</h2><p>CruizX kan bruke tjenester som Supabase, Google Mobile Ads/AdMob og valgfrie Firebase-tjenester avhengig av konfigurasjon.</p><h2>Dine valg</h2><p>Du kan styre app-tillatelser (posisjon og sporing), velge språk og kontakte oss om personvern.</p><h2>Kontakt</h2><p>Besøk <a href="https://cruizx.com" target="_blank" rel="noreferrer">cruizx.com</a> for support og juridisk kontakt.</p>`,
        },
        da: {
          back: "Tilbage til CruizX",
          updated: "Senest opdateret: 7. april 2026",
          html: `<h1>Privatlivspolitik</h1><p>Denne side forklarer hvordan CruizX håndterer persondata i appen og på websitet.</p><h2>Hvad vi indsamler</h2><ul><li>Kontooplysninger som e-mail, visningsnavn, bruger-ID og valgfrit profilbillede.</li><li>Lokations- og ruteinformation til navigation, konvojflow, ETA og kortfunktioner.</li><li>Konvoj- og chatdata, delte markeringer og live-tilstedeværelse hvor aktiveret.</li><li>Community-varsler som indsendes, bekræftes eller håndteres af brugere.</li><li>Parent Mode-indstillinger og linkede konti når funktionen bruges.</li><li>Teknisk/enhedsdata til stabilitet, misbrugsforebyggelse og analyse.</li></ul><h2>Hvorfor vi behandler data</h2><p>For at levere kernefunktioner som navigation, konvojkoordinering, kontosikkerhed, lanceringskommunikation og support.</p><h2>Tredjepartstjenester</h2><p>CruizX kan bruge tjenester som Supabase, Google Mobile Ads/AdMob og valgfrie Firebase-tjenester afhængigt af konfiguration.</p><h2>Dine valg</h2><p>Du kan styre app-tilladelser (lokation og sporing), vælge sprog og kontakte os om privatliv.</p><h2>Kontakt</h2><p>Besøg <a href="https://cruizx.com" target="_blank" rel="noreferrer">cruizx.com</a> for support og juridisk kontakt.</p>`,

        fi: {
          back: "Takaisin CruizXiin",
          updated: "Päivitetty: 7. huhtikuuta 2026",
          html: `<h1>Tietosuojakäytäntö</h1><p>Tämä sivu kertoo, miten CruizX käsittelee henkilötietoja sovelluksessa ja verkkosivulla.</p><h2>Mitä keräämme</h2><ul><li>Tilitiedot kuten sähköposti, näyttönimi, käyttäjä-ID ja valinnainen profiilikuva.</li><li>Sijainti- ja reittitiedot navigointia, konvojia, ETA:ta ja karttatoimintoja varten.</li><li>Konvoi- ja chat-tiedot, jaetut merkinnät ja live-näkyvyys, kun käytössä.</li><li>Yhteisöhälytykset, joita käyttäjät lähettävät, vahvistavat tai käsittelevät.</li><li>Parent Mode -asetukset ja linkitetyt tilit, jos ominaisuus on käytössä.</li><li>Tekninen/laiteinformaatio vakauteen, väärinkäytön estoon ja analytiikkaan.</li></ul><h2>Miksi käsittelemme tietoja</h2><p>Jotta voimme tarjota ydintoiminnot kuten navigoinnin, konvoikoordinoinnin, tiliturvan, julkaisuviestinnän ja tuen.</p><h2>Kolmannen osapuolen palvelut</h2><p>CruizX voi käyttää palveluja kuten Supabase, Google Mobile Ads/AdMob ja valinnaiset Firebase-palvelut kokoonpanosta riippuen.</p><h2>Valintasi</h2><p>Voit hallita sovelluksen käyttöoikeuksia (sijainti ja seuranta), valita kielen ja ottaa meihin yhteyttä tietosuoja-asioissa.</p><h2>Yhteys</h2><p>Käy osoitteessa <a href="https://cruizx.com" target="_blank" rel="noreferrer">cruizx.com</a> saadaksesi tuki- ja lakikontaktit.</p>`,
        },
        fr: {
          back: "Retour à CruizX",
          updated: "Dernière mise à jour : 7 avril 2026",
          html: `<h1>Politique de confidentialité</h1><p>Cette page explique comment CruizX traite les données personnelles dans l'application et sur le site web.</p><h2>Ce que nous collectons</h2><ul><li>Données de compte : e-mail, nom affiché, identifiant utilisateur et image de profil optionnelle.</li><li>Données de localisation et d'itinéraire pour la navigation, le convoi, l'ETA et la carte.</li><li>Données convoi/chat, marqueurs partagés et présence live lorsque la fonction est active.</li><li>Alertes communautaires soumises, validées ou utilisées par les utilisateurs.</li><li>Paramètres Parent Mode et comptes liés lorsque cette fonction est utilisée.</li><li>Données techniques/appareil pour la stabilité, la prévention des abus et l'analyse.</li></ul><h2>Pourquoi nous traitons ces données</h2><p>Pour fournir les fonctions principales : navigation, coordination de convoi, sécurité du compte, communication de lancement et support.</p><h2>Services tiers</h2><p>CruizX peut utiliser des services tels que Supabase, Google Mobile Ads/AdMob et des services Firebase optionnels selon la configuration.</p><h2>Vos choix</h2><p>Vous pouvez gérer les autorisations de l'app (localisation et suivi), choisir la langue et nous contacter pour toute demande liée à la confidentialité.</p><h2>Contact</h2><p>Visitez <a href="https://cruizx.com" target="_blank" rel="noreferrer">cruizx.com</a> pour les canaux de support et de contact légal.</p>`,
        },
      };

      const text = copy[lang] || copy.en;
      document.documentElement.lang = lang;
      document.getElementById("back-link").textContent = text.back;
      document.getElementById("back-link").href = `./index.html?lang=${lang}`;
      document.getElementById("updated").textContent = text.updated;
      document.getElementById("content").innerHTML = text.html;
    </script>
  </body>
</html>
