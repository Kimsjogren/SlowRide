<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CruizX | Reset password</title>
    <meta name="description" content="Reset your CruizX password" />
    <meta name="theme-color" content="#06111f" />
    <script src="./analytics.js" defer></script>
    <style>
      :root {
        --panel: rgba(10, 24, 58, 0.86);
        --line: rgba(255, 255, 255, 0.16);
        --text: #eef5ff;
        --muted: rgba(238, 245, 255, 0.8);
        --accent: #4bb4ff;
        --ok: #2ecc71;
        --err: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(rgba(5, 14, 33, 0.7), rgba(5, 14, 33, 0.86)), url("./assets/background.png") center/cover fixed no-repeat;
      }
      main {
        width: min(440px, calc(100% - 2rem));
        margin: 1.5rem auto;
        padding: 1.6rem;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { margin: 0 0 0.4rem; font-size: 1.6rem; }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 1rem; }
      label { display: block; font-size: 0.9rem; margin: 0.9rem 0 0.35rem; color: var(--text); }
      input {
        width: 100%;
        padding: 0.75rem 0.85rem;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font-size: 1rem;
      }
      button {
        width: 100%;
        margin-top: 1.2rem;
        padding: 0.85rem;
        border: none;
        border-radius: 12px;
        background: #1e6bff;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .msg { margin-top: 1rem; font-size: 0.92rem; border-radius: 10px; padding: 0.7rem 0.85rem; display: none; }
      .msg.ok { display: block; background: rgba(46, 204, 113, 0.14); border: 1px solid rgba(46, 204, 113, 0.4); color: var(--ok); }
      .msg.err { display: block; background: rgba(255, 107, 107, 0.14); border: 1px solid rgba(255, 107, 107, 0.4); color: var(--err); }
      .brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
      .brand img { height: 40px; }
      .open-app { display: none; margin-top: 0.9rem; text-align: center; }
      .open-app a { color: var(--accent); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="./assets/logga_nobg.png" alt="CruizX" onerror="this.style.display='none'" />
        <strong>CruizX</strong>
      </div>
      <h1>Reset password</h1>
      <p id="intro">Enter a new password for your CruizX account.</p>

      <form id="form">
        <label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required />
        <label for="pw2">Confirm password</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat password" required />
        <button id="submit" type="submit" disabled>Save new password</button>
      </form>

      <div class="msg" id="msg"></div>
      <div class="open-app" id="openApp">
        <a href="com.cruizx.mobile://login">Open the CruizX app</a>
      </div>
    </main>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      const SUPABASE_URL = "https://bgdtzxmcnydvracgqaht.supabase.co";
      const SUPABASE_KEY = "sb_publishable_8Fh1-rylojT88X9hpD2iFA_8CwxJXXG";

      const form = document.getElementById("form");
      const pw = document.getElementById("pw");
      const pw2 = document.getElementById("pw2");
      const submit = document.getElementById("submit");
      const msg = document.getElementById("msg");
      const openApp = document.getElementById("openApp");
      const intro = document.getElementById("intro");

      function show(kind, text) {
        msg.className = "msg " + kind;
        msg.textContent = text;
      }

      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { detectSessionInUrl: true, persistSession: false },
      });

      // The recovery link puts tokens in the URL. Wait for Supabase to parse
      // them and establish a temporary recovery session.
      let recoveryReady = false;

      supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) {
          recoveryReady = true;
          submit.disabled = false;
        }
      });

      // Fallback: also check for an existing session shortly after load in case
      // the event fired before the listener attached.
      (async () => {
        // Surface Supabase error passed back in the URL (e.g. expired link).
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const query = new URLSearchParams(window.location.search);
        const errDesc = hash.get("error_description") || query.get("error_description");
        if (errDesc) {
          show("err", decodeURIComponent(errDesc).replace(/\+/g, " ") + " Request a new reset link from the app.");
          openApp.style.display = "block";
          return;
        }

        // PKCE flow: exchange the ?code=... for a session if present.
        const code = query.get("code");
        if (code) {
          try {
            await supabase.auth.exchangeCodeForSession(code);
          } catch (_) {
            // Ignore; the getSession check below will handle failure.
          }
        }

        await new Promise((r) => setTimeout(r, 600));
        if (!recoveryReady) {
          const { data } = await supabase.auth.getSession();
          if (data && data.session) {
            recoveryReady = true;
            submit.disabled = false;
          } else {
            show("err", "This reset link is invalid or has expired. Please request a new one from the CruizX app.");
            openApp.style.display = "block";
          }
        }
      })();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        if (pw.value.length < 6) {
          show("err", "Password must be at least 6 characters.");
          return;
        }
        if (pw.value !== pw2.value) {
          show("err", "Passwords do not match.");
          return;
        }
        submit.disabled = true;
        submit.textContent = "Saving…";
        try {
          const { error } = await supabase.auth.updateUser({ password: pw.value });
          if (error) throw error;
          form.style.display = "none";
          intro.style.display = "none";
          show("ok", "Your password has been changed. You can now sign in with your new password.");
          openApp.style.display = "block";
        } catch (err) {
          show("err", (err && err.message) || "Could not update the password. Please try again.");
          submit.disabled = false;
          submit.textContent = "Save new password";
        }
      });
    </script>
  </body>
</html>
