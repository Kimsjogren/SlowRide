<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CruizX Support</title>
    <meta name="description" content="CruizX support contact page" />
    <style>
      :root {
        --panel: rgba(10, 24, 58, 0.86);
        --line: rgba(255, 255, 255, 0.16);
        --text: #eef5ff;
        --muted: rgba(238, 245, 255, 0.8);
        --accent: #4bb4ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(rgba(5, 14, 33, 0.7), rgba(5, 14, 33, 0.86)), url("./assets/background.png") center/cover fixed no-repeat;
      }
      .topbar, main { width: min(960px, calc(100% - 2rem)); margin: 1rem auto 0; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
      .back { color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 0.4rem 0.6rem; font-size: 0.9rem; white-space: nowrap; background: rgba(255, 255, 255, 0.06); }
      .date { color: var(--accent); font-size: 0.92rem; }
      main { margin-bottom: 2rem; padding: 1.3rem; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); }
      h1 { margin: 0 0 0.7rem; font-size: clamp(1.7rem, 3.8vw, 2.2rem); }
      p, li { color: var(--muted); line-height: 1.6; }
      ul { padding-left: 1.2rem; }
      .mail { display: inline-block; margin-top: 0.4rem; color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="back" id="back-link" href="./index.html">Back to CruizX</a>
      <span class="date" id="updated"></span>
    </div>
    <main id="content"></main>
    <script>
      const supported = ["da", "en", "fi", "fr", "nb", "sv"];
      const queryLang = new URLSearchParams(window.location.search).get("lang");
      const savedLang = localStorage.getItem("cruizx_site_lang");
      const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
      const lang = supported.includes(queryLang)
        ? queryLang
        : supported.includes(savedLang)
          ? savedLang
          : supported.includes(browserLang)
            ? browserLang
            : "en";

      const copy = {
        en: { back: "Back to CruizX", updated: "Last updated: April 7, 2026", html: `<h1>Support</h1><p>Need help with CruizX, launch access, or account questions? Contact us and we will get back to you as soon as possible.</p><a class="mail" href="mailto:support@cruizx.com">support@cruizx.com</a>` },
        sv: { back: "Tillbaka till CruizX", updated: "Senast uppdaterad: 7 april 2026", html: `<h1>Support</h1><p>Behöver du hjälp med CruizX, lanseringsåtkomst eller kontofrågor? Kontakta oss så återkommer vi så snart som möjligt.</p><a class="mail" href="mailto:support@cruizx.com">support@cruizx.com</a>` },
        nb: { back: "Tilbake til CruizX", updated: "Sist oppdatert: 7. april 2026", html: `<h1>Support</h1><p>Trenger du hjelp med CruizX, lanseringstilgang eller kontospørsmål? Kontakt oss, så svarer vi så snart som mulig.</p><a class="mail" href="mailto:support@cruizx.com">support@cruizx.com</a>` },
        da: { back: "Tilbage til CruizX", updated: "Senest opdateret: 7. april 2026", html: `<h1>Support</h1><p>Har du brug for hjælp med CruizX, lanceringsadgang eller kontospørgsmål? Kontakt os, så vender vi tilbage hurtigst muligt.</p><a class="mail" href="mailto:support@cruizx.com">support@cruizx.com</a>` },
        fi: { back: "Takaisin CruizXiin", updated: "Päivitetty: 7. huhtikuuta 2026", html: `<h1>Tuki</h1><p>Tarvitsetko apua CruizX:n, julkaisuoikeuden tai tiliasioiden kanssa? Ota meihin yhteyttä, niin vastaamme mahdollisimman pian.</p><a class="mail" href="mailto:support@cruizx.com">support@cruizx.com</a>` },
        fr: { back: "Retour à CruizX", updated: "Dernière mise à jour : 7 avril 2026", html: `<h1>Support</h1><p>Besoin d'aide avec CruizX, l'accès au lancement ou des questions de compte ? Contactez-nous et nous vous répondrons rapidement.</p><a class="mail" href="mailto:support@cruizx.com">support@cruizx.com</a>` },
      };

      const text = copy[lang] || copy.en;
      document.documentElement.lang = lang;
      document.getElementById("back-link").textContent = text.back;
      document.getElementById("back-link").href = `./index.html?lang=${lang}`;
      document.getElementById("updated").textContent = text.updated;
      document.getElementById("content").innerHTML = text.html;
    </script>
  </body>
</html>
